<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mybookings.css">
</head>
<body>

    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <img src="img/logo.png" alt="logo">
                    <span class="logo-text">SHOWZA</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="movie.html">MOVIES</a></li>
                    <li><a href="mybookings.html">MY BOOKINGS</a></li>
                    <li><a href="aboutus.html">ABOUT US</a></li>
                </ul>
            </div>

            <div class="nav-right">

                <div class="location-selector">
                    <select class="city-dropdown">
                        <option>Bengaluru</option>
                        <option>Mumbai</option>
                        <option>Delhi</option>
                        <option>Hyderabad</option>
                        <option>Chennai</option>
                        <option>Kolkata</option>
                        <option>Pune</option>
                        <option>Ahmedabad</option>
                        <option>Jaipur</option>
                        <option>Lucknow</option>
                        <option>Chandigarh</option>
                        <option>Indore</option>
                        <option>Bhopal</option>
                        <option>Surat</option>
                        <option>Nagpur</option>
                        <option>Patna</option>
                        <option>Ranchi</option>
                        <option>Varanasi</option>
                        <option>Kanpur</option>
                        <option>Agra</option>
                        <option>Meerut</option>
                        <option>Amritsar</option>
                        <option>Ludhiana</option>
                        <option>Jalandhar</option>
                        <option>Dehradun</option>
                        <option>Shimla</option>
                        <option>Panaji</option>
                        <option>Mangaluru</option>
                        <option>Mysuru</option>
                        <option>Hubballi</option>
                        <option>Belagavi</option>
                        <option>Vijayawada</option>
                        <option>Visakhapatnam</option>
                        <option>Tirupati</option>
                        <option>Warangal</option>
                        <option>Coimbatore</option>
                        <option>Madurai</option>
                        <option>Salem</option>
                        <option>Tiruchirappalli</option>
                        <option>Kochi</option>
                        <option>Thiruvananthapuram</option>
                        <option>Kozhikode</option>
                        <option>Thrissur</option>
                        <option>Guwahati</option>
                        <option>Shillong</option>
                        <option>Imphal</option>
                        <option>Itanagar</option>
                        <option>Aizawl</option>
                        <option>Gangtok</option>
                        <option>Bhavnagar</option>
                        <option>Rajkot</option>
                        <option>Vadodara</option>
                        <option>Nashik</option>
                        <option>Aurangabad</option>
                        <option>Kolhapur</option>
                        <option>Solapur</option>
                        <option>Udaipur</option>
                        <option>Jodhpur</option>
                        <option>Kota</option>
                        <option>Ajmer</option>
                    </select>
                </div>

                <div id="profileContainer" class="profile-container" style="display:none;">
                    <div id="profileAvatar" class="profile-avatar">AS</div>

                    <div id="profileDropdown" class="profile-dropdown">
                        <p id="profileEmail"></p>
                        <button id="logoutBtn">Logout</button>
                    </div>
                </div>

                <button class="search-btn"><i class="fas fa-search"></i></button>

                <a href="login.html">
                    <button id="signinbtn" class="sign-in-btn">
                        <i class="fas fa-user"></i>
                        Log In
                    </button>
                </a>

            </div>
        </div>
    </nav>


    
    <main class="main-content">

        
        <header class="page-header">
            <div class="header-content">
                <h1 class="page-title">My Bookings</h1>
                <p class="ticket-count"><span id="ticketCount">0</span> tickets</p>
            </div>
        </header>


        
        <div class="bookings-grid" id="bookingsGrid"></div>


        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-illustration">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="9" cy="9" r="2"></circle>
                    <path d="M21 15l-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                </svg>
            </div>
            <h2 class="empty-title">No Bookings Yet</h2>
            <p class="empty-description">Explore movies and book your first ticket!</p>
            <button class="explore-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <a href="movie.html">Explore Movies</a>
            </button>
        </div>

    </main>


    
    <div class="modal-overlay" id="ticketModal">
        <div class="modal-container">

            <button class="modal-close" id="closeModal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-content">

                
                <div class="modal-left">
                    <div class="qr-container">
                        <div class="qr-glow"></div>
                        <div class="qr-code" id="qrCode"></div>
                        <div class="qr-pulse"></div>
                    </div>
                    <p class="qr-caption">Scan this QR at theatre entrance</p>
                </div>

                
                <div class="modal-right">
                    <h2 class="modal-movie-title" id="modalMovieTitle"></h2>

                    <div class="ticket-details">

                        <div class="detail-row">
                            <span class="detail-label">Movie</span>
                            <span class="detail-value" id="detailMovie"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Guest</span>
                            <span class="detail-value" id="detailGuest"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Theatre</span>
                            <span class="detail-value" id="detailTheatre"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Date & Time</span>
                            <span class="detail-value" id="detailShowtime"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Seat</span>
                            <span class="detail-value" id="detailSeat"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Ticket #</span>
                            <span class="detail-value" id="detailTicketNum"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Payment</span>
                            <span class="detail-value" id="detailPayment"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Booked On</span>
                            <span class="detail-value" id="detailBookedOn"></span>
                        </div>

                        <div class="detail-row">
                            <span class="detail-label">Amount</span>
                            <span class="detail-value amount" id="detailAmount"></span>
                        </div>

                    </div>

                    <div class="modal-actions">
                        <button class="btn-download" id="downloadBtn">
                            Download Ticket
                        </button>

                        <button class="btn-cancel" id="cancelBtn">
                            Cancel Ticket
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="js/mybooking.js"></script>
</body>
</html>
