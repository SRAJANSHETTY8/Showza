<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater Booking</title>
    <link rel="stylesheet" href="css/booking.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css " rel="stylesheet">
</head>

<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <img src="img/logo.png" alt="logo">
                    <span class="logo-text">SHOWZA</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="movie.html">MOVIES</a></li>
                    <li><a href="mybookings.html">MY BOOKINGS</a></li>
                    <li><a href="aboutus.html">ABOUT US</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <div id="profileContainer" class="profile-container" style="display:none;">

                    <div id="profileAvatar" class="profile-avatar">
                        AS
                    </div>

                    <div id="profileDropdown" class="profile-dropdown">

                        <p id="profileEmail"></p>

                        <button id="logoutBtn">Logout</button>

                    </div>

                </div>
                <a href="login.html">
                    <button id="signinbtn" class="sign-in-btn">
                        <i class="fas fa-user"></i>
                        Log In
                    </button>
                </a>

            </div>
        </div>
    </nav>

    
    <div class="main-container">
        
        <div class="movie-info-card">
            <div class="movie-poster">
                <img id="moviePoster" src="" />
            </div>

            <div class="movie-details">
                <h1 class="movie-title" id="movieTitle"></h1>
                <div class="movie-meta">
                    <span class="rating" id="movieRating"></span>

                    <span class="duration" id="movieDuration"></span>

                </div>
                <div class="movie-genres" id="movieGenres"></div>

                <div class="showtime-info">
                    <div id="theatreInfo"></div>
                    <span id="showTime"></span>
                </div>
            </div>
        </div>
    </div>

    
    <div class="screen-section">
        <div class="screen-curve"></div>
        <p class="screen-text">SCREEN THIS WAY</p>
    </div>

    
    <div class="seat-map-container" id="seatContainer"></div>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-box available"></div>
            <span>Available</span>
        </div>
        <div class="legend-item">
            <div class="legend-box selected"></div>
            <span>Selected</span>
        </div>
        <div class="legend-item">
            <div class="legend-box locked"></div>
            <span>Locked</span>
        </div>
        <div class="legend-item">
            <div class="legend-box booked"></div>
            <span>Booked</span>
        </div>
    </div>

    
    <div class="booking-summary" id="bookingSummary">
        <div class="summary-content">
            <div class="selected-seats-info">
                <span class="seats-count">0 seats selected</span>
                <span class="seats-names" id="selectedSeatsList">None</span>
            </div>
            <div class="total-price">
                <span class="price-label">Total:</span>
                <span class="price-value" id="totalPrice">₹0</span>
            </div>

            <button class="pay-button" id="payButton" disabled>
                Pay Now
            </button>
        </div>
    </div>
    </div>

    <script src="js/booking.js"></script>
</body>

</html>
