<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Ticket </title>
    <link rel="stylesheet" href="css/ticket.css">
</head>

<body>
   
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <img src="img/logo.png" alt="logo">
                    <span class="logo-text">SHOWZA</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="movie.html">MOVIES</a></li>
                    <li><a href="mybookings.html">MY BOOKINGS</a></li>
                    <li><a href="aboutus.html">ABOUT US</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <div id="profileContainer" class="profile-container" style="display:none;">

                    <div id="profileAvatar" class="profile-avatar">
                        AS
                    </div>

                    <div id="profileDropdown" class="profile-dropdown">

                        <p id="profileEmail"></p>

                        <button id="logoutBtn">Logout</button>

                    </div>

                </div>

                <a href="login.html">
                    <button id="signinbtn" class="sign-in-btn">
                        <i class="fas fa-user"></i>
                        Log In
                    </button>
                </a>

            </div>
        </div>
    </nav>

    
    <main class="main-content">
        <h1 class="page-title">Your Ticket</h1>

        
        <div class="qr-section">
            <div class="qr-card">
                <div class="qr-glow"></div>
                <div class="qr-wrapper">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=SHOWZA-TKT-987654-RRR-PVR-Orion"
                        alt="Ticket QR Code" class="qr-code">
                </div>
            </div>
            <p class="qr-caption">Scan this code at the theatre entrance</p>
        </div>

        
        <div class="ticket-details-card">
            <h2 class="details-title">Ticket Details</h2>
            <div class="details-divider"></div>

            <div class="detail-item">
                <div class="detail-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                </div>
                <div class="detail-content">
                    <span class="detail-label">Movie</span>
                    <span class="detail-value"></span>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <div class="detail-content">
                    <span class="detail-label">Theatre</span>
                    <span class="detail-value"></span>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </div>
                <div class="detail-content">
                    <span class="detail-label">Showtime</span>
                    <span class="detail-value"></span>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="detail-content">
                    <span class="detail-label">Seats</span>
                    <span class="detail-value"></span>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="9" x2="20" y2="9"></line>
                        <line x1="4" y1="15" x2="20" y2="15"></line>
                        <line x1="10" y1="3" x2="8" y2="21"></line>
                        <line x1="16" y1="3" x2="14" y2="21"></line>
                    </svg>
                </div>
                <div class="detail-content">
                    <span class="detail-label">Ticket No.</span>
                    <span class="detail-value"></span>
                </div>
            </div>
        </div>

        
        <div class="action-buttons">
            <button class="btn btn-cancel">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Cancel Ticket
            </button>
            <button class="btn btn-download">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Ticket
            </button>
        </div>

        
        <div id="cancel-modal" class="success-modal">
            <div class="success-card">
                <div class="success-icon">✓</div>
                <h2>Ticket Cancelled Successfully</h2>
                <p>Your ticket has been cancelled.</p>

                <button id="exploreBtn" class="success-btn">
                    Explore Movies
                </button>
            </div>
        </div>

    </main>

    <script src="js/ticket.js"></script>
</body>

</html>
