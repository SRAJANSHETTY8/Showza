    <section class="hero-section">
        <div class="carousel-container">
            <button class="carousel-arrow left"><i class="fas fa-chevron-left"></i></button>

            <div class="carousel-slide active">
                <div class="slide-content">
                    <img src="img/poster1.png" alt="Movie">
                </div>
            </div>

            <div class="carousel-slide">
                <div class="slide-content">
                    <img src="img/poster2.png" alt="Movie">
                </div>
            </div>
            <div class="carousel-slide">
                <div class="slide-content">
                    <img src="img/poster3.png" alt="Movie">
                </div>
            </div>

            <button class="carousel-arrow right"><i class="fas fa-chevron-right"></i></button>

            <div class="carousel-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </section>

    
    <div class="search-bar-container reveal" id="searchSection">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
        </div>
    </div>

    
    <section class="movies-section reveal">
        <div class="section-header">
            <div class="title-group">
                <h2>NOW SHOWING</h2>
                <p>Book your favorite movies today</p>
            </div>
            <a href="movie.html" class="see-all">See All <i class="fas fa-chevron-right"></i></a>
        </div>

        <div class="movies-carousel">
            <button class="nav-arrow left"><i class="fas fa-chevron-left"></i></button>

            <div class="movies-grid" id="moviesContainer">

            </div>

            <button class="nav-arrow right"><i class="fas fa-chevron-right"></i></button>
        </div>
    </section>

    
    <section class="movies-section recommended reveal">
        <div class="section-header">
            <div class="title-group">
                <h2>Recommended Movies</h2>
            </div>
            <a href="movie.html" class="see-all">
                See All <i class="fas fa-chevron-right"></i>
            </a>
        </div>

        <div class="movies-carousel">
            <button class="nav-arrow left">
                <i class="fas fa-chevron-left"></i>
            </button>

            
            <div class="movies-grid" id="recommendedContainer">
            </div>

            <button class="nav-arrow right">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </section>
