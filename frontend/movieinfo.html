                        Log In
                    </button>
                </a>

        </div>

    <section class="hero">
        <div class="hero-container">
            <div class="hero-content">
                
                <span id="movieGenre" class="tag tag-secondary"></span>


                
                <h1 class="movie-title">
                    <span id="movieTitleWhite" class="title-white"></span>
                    <span id="movieTitleAccent" class="title-accent"></span>
                </h1>



                
                <div class="movie-meta">
                    <div class="meta-item rating">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                        </svg>
                        <span class="meta-text"><strong id="movieRating"></strong></span>
                    </div>
                    <div class="meta-item duration">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        <span id="movieDuration"></span>
                    </div>
                    <div class="meta-item year">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        <span id="movieYear"></span>
                    </div>
                </div>

                
                <p id="movieDescription" class="movie-description"></p>

                
                <div class="action-buttons">
                    <button class="btn btn-primary btn-watch">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        Watch Trailer
                    </button>
                    <button class="btn btn-secondary btn-book">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                            <path d="M8 14h.01" />
                            <path d="M12 14h.01" />
                            <path d="M16 14h.01" />
                            <path d="M8 18h.01" />
                            <path d="M12 18h.01" />
                            <path d="M16 18h.01" />
                        </svg>
                        Book Tickets
                    </button>
                </div>
            </div>

            
            <div class="hero-image-container">
                <div class="hero-image-wrapper">
                    <img id="moviePoster" class="hero-image">

                    <div class="image-glow"></div>
                </div>
            </div>
        </div>
    </section>

    
    <section class="trending">
        <div class="trending-header">
            <h2 class="trending-title">Trending Now</h2>
            <a href="movie.html" class="view-all">View All →</a>
        </div>

        <div class="movies-grid" id="trendingContainer">
        </div>
    </section>

    <script src="js/movieinfo.js"></script>
